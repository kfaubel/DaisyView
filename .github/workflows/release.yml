name: Release

on:
  push:
    tags: ['v*']

# This release script uses an Automatic token (GITHUB_TOKEN).  The following section adds the
# required write permission to the contents section.  We don't need to create our own token.
permissions:
  contents: write
  
jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Publish
      run: dotnet publish DaisyView -c Release -r win-x64 --no-self-contained --output ./publish
      
    - name: Create ZIP package
      run: |
        cd publish
        # Remove debug files
        Remove-Item *.pdb
        # Create release package
        Compress-Archive -Path * -DestinationPath ../DaisyView-win-x64-${{ github.ref_name }}.zip
        cd ..

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build Setup EXE
      run: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        $VERSION = "${{ github.ref_name }}".TrimStart('v')
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$VERSION" installer.iss
        Copy-Item installer-output\DaisyView-Setup-*.exe .\DaisyView-Setup-${{ github.ref_name }}.exe

    - name: Verify release artifacts
      run: |
        Get-Item DaisyView-win-x64-${{ github.ref_name }}.zip | Format-List Name, Length
        Get-Item DaisyView-Setup-${{ github.ref_name }}.exe | Format-List Name, Length
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          DaisyView-win-x64-${{ github.ref_name }}.zip
          DaisyView-Setup-${{ github.ref_name }}.exe
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        name: DaisyView ${{ github.ref_name }}
        body: |
          ## DaisyView ${{ github.ref_name }}
          
          ### System Requirements
          - Windows 10/11 (64-bit)
          - [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)
          
           ### Installation Options

           #### Option 1: Setup EXE (Recommended)
           1. Download DaisyView-Setup-${{ github.ref_name }}.exe
           2. Run the installer
           3. The installer will:
             - Check for .NET 8 Desktop Runtime (prompts to download if missing)
             - Install to %LOCALAPPDATA%\DaisyView
             - Create Start Menu shortcuts
             - Use streamlined setup flow (2-3 clicks)

           #### Option 2: Portable ZIP
           1. Download DaisyView-win-x64-${{ github.ref_name }}.zip
           2. Extract all files to a folder
           3. Run DaisyView.exe
          
          ### What's New
          See the automatically generated release notes below.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
